[project]
name = "archtool"
version = "0.1.0"
description = "Tools to build, check and render architecture models stored as text"
requires-python = ">=3.12"
dependencies = [
    "tatsu>=5.24.0",
]

[project.scripts]
archtool = "archtool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tatsu", "tatsu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["archtool.language._parser"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "archtool"
version = "0.1.0"
description = "Tools to build, check and render architecture models stored as text"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
dependencies = [
    "aiohttp>=3.14.4",
    "tatsu>=5.24.0",
]

[project.scripts]
archtool = "archtool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["tatsu", "tatsu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["archtool.language._parser"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
